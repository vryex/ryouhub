name: Migrate legacy assets to Ryou

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ryou
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone legacy public repository
        run: git clone --depth 1 https://github.com/vryex/xero-scripts.git /tmp/xero-scripts

      - name: Copy runtime assets into Ryou
        shell: bash
        run: |
          set -euo pipefail
          for dir in assets death_effects_final icons skyboxes sounds textures; do
            rm -rf "$dir"
            cp -a "/tmp/xero-scripts/$dir" "./$dir"
          done

          mkdir -p legacy
          cp -f "/tmp/xero-scripts/onyxhub" "legacy/onyxhub.lua" || true

      - name: Commit migrated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryou Migration"
          git config user.email "actions@users.noreply.github.com"
          git add assets death_effects_final icons skyboxes sounds textures legacy
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Migrate legacy runtime assets into Ryou"
            git push origin HEAD:main
          fi

      - name: Attempt to make repository public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f visibility=public
